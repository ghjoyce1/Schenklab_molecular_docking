<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schenklab Molecular Docking Tutorial</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f5f4;
      color: #1f2328;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      max-width: 38rem;
      padding: 2rem;
    }

    a, button {
      color: #0b6e6e;
    }

    dialog {
      width: min(94vw, 1100px);
      height: 92vh;
      max-width: none;
      max-height: none;
      padding: 0;
      border: 1px solid #dcdfe3;
      border-radius: 8px;
      background: #fff;
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 65%);
    }

    .dialog-header {
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      border-bottom: 1px solid #dcdfe3;
    }

    .dialog-header a {
      margin-left: auto;
      margin-right: 1rem;
    }

    .dialog-header button {
      padding: .35rem .7rem;
      cursor: pointer;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 3rem);
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Schenklab Molecular Docking</h1>
    <p>The tutorial opens automatically. If it does not, use the button below.</p>
    <button id="open-tutorial" type="button">Open tutorial</button>
    <p><a href="./Tutorial.html">Open the tutorial as a full page</a></p>
  </main>

  <dialog id="tutorial-dialog" aria-label="Docking pipeline tutorial">
    <div class="dialog-header">
      <strong>Tutorial</strong>
      <a href="./Tutorial.html" target="_blank" rel="noopener">Open full page</a>
      <button id="close-tutorial" type="button">Close</button>
    </div>
    <iframe src="./Tutorial.html" title="Zinc Metalloprotein Docking Pipeline tutorial"></iframe>
  </dialog>

  <script>
    const tutorialDialog = document.querySelector("#tutorial-dialog");
    const openTutorial = () => tutorialDialog.showModal();

    document.querySelector("#open-tutorial").addEventListener("click", openTutorial);
    document.querySelector("#close-tutorial").addEventListener("click", () => tutorialDialog.close());
    window.addEventListener("DOMContentLoaded", openTutorial);
  </script>
</body>
</html>
